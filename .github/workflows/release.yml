name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: ghostcase-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: ghostcase-macos-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: ghostcase-macos-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The same gates as CI: a tag never ships a build that does not pass.
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -C strip=symbols

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/stage"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/ghostcase" "$staging/ghostcase"
          cp README.md LICENSE "$staging/"
          tar -C "$staging" -czf "$RUNNER_TEMP/${{ matrix.archive }}" .
          echo "Built ${{ matrix.archive }}"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "Ghostcase ${GITHUB_REF_NAME}" \
            --generate-notes \
            "$RUNNER_TEMP/${{ matrix.archive }}" || \
          gh release upload "${GITHUB_REF_NAME}" \
            "$RUNNER_TEMP/${{ matrix.archive }}" --clobber
