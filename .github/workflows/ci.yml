name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Run synthetic example
        run: |
          cargo run --release -- minimize \
            --input examples/importer/input.json \
            --config examples/importer/ghostcase.toml \
            --output "$RUNNER_TEMP/ghostcase-minimized.json" \
            --export-dir "$RUNNER_TEMP/ghostcase-review"
          test -s "$RUNNER_TEMP/ghostcase-minimized.json"
          test -s "$RUNNER_TEMP/ghostcase-review/candidate.json"
          test -s "$RUNNER_TEMP/ghostcase-review/report.json"
          test -s "$RUNNER_TEMP/ghostcase-review/recipe.json"
      - name: Run Unicode validation example
        run: |
          cargo run --release -- minimize \
            --input examples/unicode-id-collision/input.json \
            --config examples/unicode-id-collision/ghostcase.toml \
            --output "$RUNNER_TEMP/ghostcase-unicode.json" \
            --export-dir "$RUNNER_TEMP/ghostcase-unicode-review"
          test -s "$RUNNER_TEMP/ghostcase-unicode.json"
          test -s "$RUNNER_TEMP/ghostcase-unicode-review/candidate.json"
          test -s "$RUNNER_TEMP/ghostcase-unicode-review/report.json"
          test -s "$RUNNER_TEMP/ghostcase-unicode-review/recipe.json"
      # The reduced shape is asserted in tests/cli.rs; this step only guards
      # against a fixture that stops being runnable end to end.
      - name: Run search filter example
        run: |
          cargo run --release -- minimize \
            --input examples/search-filter-overlap/input.json \
            --config examples/search-filter-overlap/ghostcase.toml \
            --output "$RUNNER_TEMP/ghostcase-search.json" \
            --export-dir "$RUNNER_TEMP/ghostcase-search-review"
          test -s "$RUNNER_TEMP/ghostcase-search.json"
          test -s "$RUNNER_TEMP/ghostcase-search-review/candidate.json"
          test -s "$RUNNER_TEMP/ghostcase-search-review/report.json"
          test -s "$RUNNER_TEMP/ghostcase-search-review/recipe.json"
