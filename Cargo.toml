[package]
name = "ghostcase"
version = "0.1.0"
edition = "2024"
description = "Minimize JSON bug reproductions while replacing protected data"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
tempfile = "3"
toml = "0.9"
